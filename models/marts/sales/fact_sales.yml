version: 2

models:
  - name: fact_sales
    description: "Sales fact at order line grain. One row per sales order line, with additive measures for quantity, gross, discount and net amounts. Gross amount is unit price times quantity, before discounts."
    data_tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('stg_sales_order_detail')
      - dbt_utils.expression_is_true:
          expression: "vl_net = vl_gross - vl_discount"
      - dbt_utils.expression_is_true:
          expression: "vl_discount <= vl_gross"
      - dbt_utils.expression_is_true:
          expression: "abs((select sum(vl_gross) from {{ ref('fact_sales') }}) - (select sum(vl_unit_price * qt_order) from {{ ref('stg_sales_order_detail') }})) < 0.01"
    columns:
      - name: sk_sales_order_detail
        description: "Surrogate key of the order line (primary key)."
        data_tests:
          - unique
          - not_null

      - name: nk_sales_order_detail
        description: "Natural key of the order line in the source."
        data_tests:
          - unique
          - not_null

      - name: nk_sales_order
        description: "Natural key of the order (degenerate dimension). Links the line to the order sales reason bridge. Several lines share the same order."
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_sales_order_header')
              field: nk_sales_order

      - name: nk_product
        description: "Natural key of the product. Links to the product dimension."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: sk_product

      - name: nk_customer
        description: "Natural key of the customer. Links to the customer dimension."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: sk_customer

      - name: nk_credit_card
        description: "Natural key of the credit card. Links to the credit card dimension. Is -1 (Unknown member) when the order has no card."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_credit_cards')
              field: sk_credit_card

      - name: nk_order_status
        description: "Natural key of the order status. Links to the order status dimension."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_order_statuses')
              field: sk_order_status

      - name: fk_geography
        description: "Foreign key to the geography dimension (state or province plus city), based on the ship-to address."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_geographies')
              field: sk_geography

      - name: dt_order
        description: "Date the order was placed. Links to the date dimension."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: sk_date

      - name: is_online_order
        description: "True when the order was placed online, false when placed by a salesperson."
        data_tests:
          - not_null

      - name: qt_order
        description: "Quantity of units sold in the line."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1

      - name: vl_gross
        description: "Gross amount of the line: unit price times quantity, before discounts."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: vl_discount
        description: "Discount amount of the line: gross amount times the discount rate."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0

      - name: vl_net
        description: "Net amount of the line: gross amount minus discount amount."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
