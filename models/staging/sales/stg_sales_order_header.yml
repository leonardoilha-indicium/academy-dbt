version: 2

models:
  - name: stg_sales_order_header
    description: "Sales order headers with renamed and typed columns. One row per order."
    columns:
      - name: nk_sales_order
        description: "Natural key of the order."
        data_tests:
          - unique
          - not_null

      - name: nk_customer
        description: "Customer who placed the order."
        data_tests:
          - not_null

      - name: nk_sales_person
        description: "Salesperson responsible for the order. Null for online orders."

      - name: nk_territory
        description: "Sales territory of the order."
        data_tests:
          - not_null

      - name: nk_bill_to_address
        description: "Billing address."

      - name: nk_ship_to_address
        description: "Shipping address."
        data_tests:
          - not_null

      - name: nk_ship_method
        description: "Shipping method used in the order."
        data_tests:
          - not_null

      - name: nk_credit_card
        description: "Credit card used. Null when not informed."

      - name: dt_order
        description: "Date the order was placed."
        data_tests:
          - not_null

      - name: dt_due
        description: "Date the order is due to the customer."
        data_tests:
          - not_null

      - name: dt_ship
        description: "Date the order was shipped."
        data_tests:
          - not_null

      - name: nk_order_status
        description: "Order status code (1 to 6)."
        data_tests:
          - not_null

      - name: is_online_order
        description: "True when the order was placed online."

      - name: vl_subtotal
        description: "Order subtotal, net of discounts."

      - name: vl_tax
        description: "Order tax amount."

      - name: vl_freight
        description: "Order freight amount."

      - name: vl_total_due
        description: "Total due (subtotal + tax + freight)."
