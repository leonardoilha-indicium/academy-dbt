version: 2

models:
  - name: stg_credit_card
    description: "Credit cards used in orders."
    columns:
      - name: credit_card_id
        description: "Primary key of the credit card."
        data_tests:
          - unique
          - not_null

      - name: card_type
        description: "Card brand or type."
        data_tests:
          - not_null
