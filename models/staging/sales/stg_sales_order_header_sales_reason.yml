version: 2

models:
  - name: stg_sales_order_header_sales_reason
    description: "Link between orders and sales reasons. An order can have several reasons."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - nk_sales_order
            - nk_sales_reason
    columns:
      - name: nk_sales_order
        description: "Order."
        data_tests:
          - not_null

      - name: nk_sales_reason
        description: "Sales reason."
        data_tests:
          - not_null
