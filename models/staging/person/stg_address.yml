version: 2

models:
  - name: stg_address
    description: "Billing and shipping addresses."
    columns:
      - name: nk_address
        description: "Primary key of the address."
        data_tests:
          - unique
          - not_null

      - name: nk_state_province
        description: "State or province of the address."
        data_tests:
          - not_null

      - name: nm_city
        description: "City name."
