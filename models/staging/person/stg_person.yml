version: 2

models:
  - name: stg_person
    description: "People, used to get the name of individual customers."
    columns:
      - name: nk_person
        description: "Primary key of the person."
        data_tests:
          - unique
          - not_null

      - name: nm_first
        description: "First name."

      - name: nm_middle
        description: "Middle name."

      - name: nm_last
        description: "Last name."
