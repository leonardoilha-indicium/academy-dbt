version: 2

models:
  - name: stg_state_province
    description: "States and provinces."
    columns:
      - name: nk_state_province
        description: "Primary key of the state or province."
        data_tests:
          - unique
          - not_null

      - name: cd_state_province
        description: "State or province abbreviation, trimmed."

      - name: cd_country_region
        description: "Code of the country."
        data_tests:
          - not_null

      - name: nm_state_province
        description: "Name of the state or province."
