version: 2

models:
  - name: stg_product_subcategory
    description: "Product subcategories."
    columns:
      - name: nk_product_subcategory
        description: "Primary key of the subcategory."
        data_tests:
          - unique
          - not_null

      - name: nk_product_category
        description: "Category the subcategory belongs to."
        data_tests:
          - not_null

      - name: nm_product_subcategory
        description: "Name of the subcategory."
