version: 2

models:
  - name: stg_product_cost_history
    description: "Standard cost history of the products with renamed and typed columns. One row per product and cost period."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - nk_product
            - dt_start
    columns:
      - name: nk_product
        description: "Natural key of the product the cost belongs to."
        data_tests:
          - not_null

      - name: dt_start
        description: "First date the cost applies."
        data_tests:
          - not_null

      - name: dt_end
        description: "Last date the cost applies. Null for the current cost."

      - name: vl_standard_cost
        description: "Standard cost of one unit of the product in the period."
        data_tests:
          - not_null
