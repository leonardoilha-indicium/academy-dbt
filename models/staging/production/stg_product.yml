version: 2

models:
  - name: stg_product
    description: "Product catalog."
    columns:
      - name: nk_product
        description: "Primary key of the product."
        data_tests:
          - unique
          - not_null

      - name: nk_product_subcategory
        description: "Subcategory of the product. Can be null."

      - name: nm_product
        description: "Product name."
        data_tests:
          - not_null

      - name: cd_product
        description: "Product code."

      - name: ds_color
        description: "Product color."

      - name: vl_standard_cost
        description: "Standard cost of the product."

      - name: vl_list_price
        description: "List price of the product."
