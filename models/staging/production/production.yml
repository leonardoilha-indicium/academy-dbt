version: 2

sources:
  - name: production
    description: "Raw Adventure Works product data, loaded from seeds into the adventure_works schema."
    database: adventure_works_dw
    schema: adventure_works

    tables:
      - name: product
        description: "Product catalog."
        columns:
          - name: productid
            description: "Primary key of the product."
            data_tests:
              - unique
              - not_null

          - name: name
            description: "Product name."
            data_tests:
              - not_null

          - name: productsubcategoryid
            description: "Subcategory of the product. Can be null."
            data_tests:
              - relationships:
                  to: source('production', 'productsubcategory')
                  field: productsubcategoryid

      - name: productsubcategory
        description: "Product subcategories."
        columns:
          - name: productsubcategoryid
            description: "Primary key of the subcategory."
            data_tests:
              - unique
              - not_null

          - name: productcategoryid
            description: "Category the subcategory belongs to."
            data_tests:
              - not_null
              - relationships:
                  to: source('production', 'productcategory')
                  field: productcategoryid

      - name: productcategory
        description: "Product categories."
        columns:
          - name: productcategoryid
            description: "Primary key of the category."
            data_tests:
              - unique
              - not_null

      - name: productcosthistory
        description: "Standard cost history of the products. One row per product and cost period."
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - productid
                - startdate
        columns:
          - name: productid
            description: "Product the cost belongs to."
            data_tests:
              - not_null
              - relationships:
                  to: source('production', 'product')
                  field: productid

          - name: startdate
            description: "First date the cost applies."
            data_tests:
              - not_null

          - name: enddate
            description: "Last date the cost applies. Null for the current cost."

          - name: standardcost
            description: "Standard cost of one unit of the product in the period."
            data_tests:
              - not_null
