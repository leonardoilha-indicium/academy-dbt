name: 'adventure_works_ae'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# Camadas do projeto:
#   staging      -> views 1:1 com as tabelas do schema adventure_works
#   intermediate -> ephemeral, regras intermediarias (ex.: sales reasons por pedido)
#   marts        -> tabelas (dimensoes e fatos) consumidas pelo Power BI
# O schema customizado e usado exatamente como escrito (ver macros/generate_schema_name.sql)
models:
  adventure_works_ae:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: staging
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table

# Seeds do Adventure Works (RAW). O enunciado exige usar apenas o schema adventure_works
seeds:
  adventure_works_ae:
    sap_adventure_works:
      +schema: adventure_works
